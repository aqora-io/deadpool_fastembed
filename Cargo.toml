[package]
name = "deadpool_fastembed"
version = "1.1.1"
edition = "2024"
rust-version = "1.89.0"
authors = ["Angel Dijoux <angel@aqora.io>"]
description = "Dead simple async pool for fastembed"
keywords = ["async", "fastembed", "pool"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aqora-io/deadpool_fastembed"
readme = "README.md"

[lib]
name = "deadpool_fastembed"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
deadpool = { version = "0.13", default-features = false, features = [
  "managed",
] }
fastembed = { version = "5.13", default-features = false }
candle-core = { version = "0.10", default-features = false, optional = true }
candle-nn = { version = "0.10", default-features = false, optional = true }

[features]
default = ["rt_tokio_1"]
rt_tokio_1 = ["deadpool/rt_tokio_1"]
rt_async-std_1 = ["deadpool/rt_async-std_1"]

# Re-export of fastembed features
hf-hub = ["fastembed/hf-hub"]
hf-hub-native-tls = ["fastembed/hf-hub-native-tls"]
hf-hub-rustls-tls = ["fastembed/hf-hub-rustls-tls"]
image-models = ["fastembed/image-models"]
nomic-v2-moe = ["fastembed/nomic-v2-moe"]
ort-download-binaries = ["fastembed/ort-download-binaries"]
ort-download-binaries-native-tls = ["fastembed/ort-download-binaries-native-tls"]
ort-download-binaries-rustls-tls = ["fastembed/ort-download-binaries-rustls-tls"]
ort-load-dynamic = ["fastembed/ort-load-dynamic"]
optimum-cli = ["fastembed/optimum-cli"]
online = ["fastembed/online"]
directml = ["fastembed/directml"]

qwen3 = ["fastembed/qwen3", "candle-core", "candle-nn"]
accelerate = ["qwen3", "fastembed/accelerate"]
mkl = ["qwen3", "fastembed/mkl"]
cuda = ["qwen3", "fastembed/cuda"]
cudnn = ["qwen3", "fastembed/cudnn", "cuda"]
metal = ["qwen3", "fastembed/metal"]
